    <div class="p-date-row">
      <div class="p-date" id="pDate">—</div>
      <div class="p-dayname" id="pDay">&nbsp;</div>
    </div>
    <div class="prayer-rows" id="pRows"></div>
    <button class="jump-today" onclick="goToday()">↺ Jump to Today</button>
    <div class="countdown" id="countdown" style="display:none">

      <div class="cd-value" id="cdVal">—</div>
